group = "com.hyperfi.mpc"
version = "1.0.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.hyperfi.mpc"

    compileSdk = 34

    defaultConfig {
        minSdk = 24
    }

    // Prebuilt Go core: native/android/<abi>/libmpc.so is packaged as-is.
    // The .so files are built with -Wl,-z,max-page-size=16384 and verified
    // 16 KB aligned (Google Play requirement for Android 15+ devices).
    sourceSets {
        main {
            jniLibs.srcDirs += "${projectDir}/../native/android"
        }
    }
}
