name: mpc_dart
description: >-
  Flutter FFI bindings for threshold signatures: {2,n}-threshold ECDSA
  (Lindell 17) and 2-party Ed25519, with BIP32-style key derivation and key
  share refresh. Powered by a Go core (okx/threshold-lib).
version: 1.0.0
homepage: https://github.com/hyper-fi/mpc-dart
repository: https://github.com/hyper-fi/mpc-dart
issue_tracker: https://github.com/hyper-fi/mpc-dart/issues

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  convert: ^3.1.0
  crypto: ^3.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
